name: E2E

on:
  pull_request:
    paths:
      - ".github/workflows/e2e.yml"
      - "backend/**"
      - "frontend/**"
      - "e2e/**"
      - ".env.example"
      - ".npmrc"
      - "pnpm-workspace.yaml"
      - "docker-compose.yml"
      - "pnpm-lock.yaml"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/e2e.yml"
      - "backend/**"
      - "frontend/**"
      - "e2e/**"
      - ".env.example"
      - ".npmrc"
      - "pnpm-workspace.yaml"
      - "docker-compose.yml"
      - "pnpm-lock.yaml"

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      has_e2e: ${{ steps.check.outputs.has_e2e }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: echo "has_e2e=$([ -f e2e/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  static-checks:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure environment
        run: cp .env.example .env

      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile --trust-lockfile

      - name: Install E2E dependencies
        run: pnpm install --dir e2e --frozen-lockfile --ignore-workspace --trust-lockfile

      - name: Generate Prisma client
        run: pnpm -C backend prisma:generate

      - name: Run workspace typecheck
        run: pnpm typecheck

      - name: Run workspace lint checks
        run: pnpm check

      - name: Check enum i18n coverage
        run: pnpm -C backend check:enum-i18n

      - name: Run E2E typecheck
        run: pnpm -C e2e typecheck

  # 036 remediation (2026-07-31): this repo's own instance (github.com/appspine/
  # appspine-app-template) already has a registered client in the shared dev-infra realm
  # (client ID "template", dev-infra/README.md's client table) — the concern below about
  # "this template's own CI can't assume access to dev-infra" was about generic reuse outside
  # this org; for THIS repo, in THIS org, it can, so the pilot fix (a pre-baked Keycloak
  # service image built by appspine-workspace's keycloak-image.yml) applies the same way it
  # did for the other 8 apps. A fork into a different GitHub org would need its own image/
  # realm — that generic-reuse gap is still real, just not this repo's problem to solve.
  # See dev_docs/framework/036-task-breakdown.md.
  e2e:
    needs:
      - detect
      - static-checks
    if: needs.detect.outputs.has_e2e == 'true'
    runs-on: ubuntu-latest
    services:
      keycloak:
        image: ghcr.io/appspine/keycloak-dev:latest
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.PACKAGES_READ_TOKEN }}
        env:
          KEYCLOAK_ADMIN: admin
          KEYCLOAK_ADMIN_PASSWORD: admin
        ports:
          - 8180:8080
    env:
      GITHUB_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure environment
        run: |
          cp .env.example .env
          {
            echo "OIDC_AUDIENCE=template"
            echo "AUTH_KEYCLOAK_ID=template"
            echo "AUTH_KEYCLOAK_SECRET=dev-secret-template"
          } >> .env

      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile --trust-lockfile

      - name: Install E2E dependencies
        run: pnpm install --dir e2e --frozen-lockfile --ignore-workspace --trust-lockfile

      - name: Wait for Keycloak
        shell: bash
        run: |
          for i in {1..60}; do
            if curl -fsS "http://localhost:8180/realms/appspine-dev" >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Keycloak did not become ready in time." >&2
          exit 1

      - name: Start database
        run: docker compose up -d db

      - name: Prepare database
        shell: bash
        run: |
          set -a
          source .env
          set +a
          pnpm -C backend prisma:generate
          pnpm -C backend prisma:deploy
          pnpm -C backend prisma:seed

      - name: Install Playwright browsers
        run: pnpm --dir e2e exec playwright install --with-deps chromium

      - name: Start application
        shell: bash
        run: |
          set -a
          source .env
          set +a
          export E2E_API_URL="http://127.0.0.1:${BACKEND_PORT}"
          export E2E_BASE_URL="http://localhost:${FRONTEND_PORT}"
          nohup pnpm -C backend dev > backend-dev.log 2>&1 &
          NEXT_PUBLIC_API_URL="$E2E_API_URL" nohup pnpm -C frontend dev > frontend-dev.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS "$E2E_API_URL/health" >/dev/null && curl -fsS "$E2E_BASE_URL/login" >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Application did not become ready in time." >&2
          exit 1

      - name: Run E2E suite
        shell: bash
        run: |
          set -a
          source .env
          set +a
          export E2E_API_URL="http://127.0.0.1:${BACKEND_PORT}"
          export E2E_BASE_URL="http://localhost:${FRONTEND_PORT}"
          # test-env.ts's own defaults (dev-admin/dev-admin-pass, dev-user/dev-user-pass,
          # dev-user@appspine-dev.local, client "template"/"dev-secret-template") match the
          # shared dev-infra Keycloak, which this job now runs as a service (see the
          # "keycloak" service block and the "Wait for Keycloak" step above).
          pnpm --dir e2e test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
            backend-dev.log
            frontend-dev.log
