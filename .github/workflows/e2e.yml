name: E2E

on:
  pull_request:
    paths:
      - ".github/workflows/e2e.yml"
      - "backend/**"
      - "frontend/**"
      - "e2e/**"
      - ".env.example"
      - ".npmrc"
      - "pnpm-workspace.yaml"
      - "docker-compose.yml"
      - "pnpm-lock.yaml"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/e2e.yml"
      - "backend/**"
      - "frontend/**"
      - "e2e/**"
      - ".env.example"
      - ".npmrc"
      - "pnpm-workspace.yaml"
      - "docker-compose.yml"
      - "pnpm-lock.yaml"

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      has_e2e: ${{ steps.check.outputs.has_e2e }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: echo "has_e2e=$([ -f e2e/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  static-checks:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure environment
        run: cp .env.example .env

      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile --trust-lockfile

      - name: Install E2E dependencies
        run: pnpm install --dir e2e --frozen-lockfile --ignore-workspace --trust-lockfile

      - name: Generate Prisma client
        run: pnpm -C backend prisma:generate

      - name: Run workspace typecheck
        run: pnpm typecheck

      - name: Run workspace lint checks
        run: pnpm check

      - name: Check enum i18n coverage
        run: pnpm -C backend check:enum-i18n

      - name: Run E2E typecheck
        run: pnpm -C e2e typecheck

  # KNOWN GAP (dev_docs/framework/035): this job does not yet start a Keycloak service, so it
  # cannot actually authenticate — every auth-dependent spec will fail with a connection error
  # against E2E_KEYCLOAK_ISSUER's default (http://localhost:8180), not a clean pass. Local auth
  # is retired; there is no in-process fallback the backend/frontend can authenticate against
  # instead. What's still needed to close this gap:
  #   1. A Keycloak service container in this job (image quay.io/keycloak/keycloak:26.0,
  #      `start-dev --import-realm`, health-checked on the management port — see
  #      dev-infra/docker-compose.yml in the appspine monorepo for the pattern this template's
  #      own local dev setup already uses).
  #   2. A realm-import JSON checked into THIS repo (not referenced from dev-infra, which lives
  #      in a separate monorepo this template's own CI can't assume access to) defining: this
  #      app's OIDC client (client ID/secret matching whatever OIDC_AUDIENCE/AUTH_KEYCLOAK_ID
  #      this fork's .env.example carries), a couple of fixed test users, and matching
  #      OIDC_JWKS_URL/OIDC_ISSUER/AUTH_KEYCLOAK_ISSUER overrides for the CI env.
  #   3. Since every fork registers its own client ID (dev-infra/README.md "Adding a 10th app"),
  #      that realm JSON is fork-specific, not something scaffold-init.mjs can stamp out
  #      automatically today — building and validating one is future template work, not
  #      something this pass could safely fabricate without a live CI run to verify against.
  # Until then, this at least stops the job from claiming SEED_USER_PASSWORD/E2E_USER_PASSWORD/
  # E2E_ADMIN_EMAIL (retired local-auth vars test-env.ts no longer reads) do anything real.
  e2e:
    needs:
      - detect
      - static-checks
    if: needs.detect.outputs.has_e2e == 'true'
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure environment
        run: cp .env.example .env

      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile --trust-lockfile

      - name: Install E2E dependencies
        run: pnpm install --dir e2e --frozen-lockfile --ignore-workspace --trust-lockfile

      - name: Start database
        run: docker compose up -d db

      - name: Prepare database
        shell: bash
        run: |
          set -a
          source .env
          set +a
          pnpm -C backend prisma:generate
          pnpm -C backend prisma:deploy
          pnpm -C backend prisma:seed

      - name: Install Playwright browsers
        run: pnpm --dir e2e exec playwright install --with-deps chromium

      - name: Start application
        shell: bash
        run: |
          set -a
          source .env
          set +a
          export E2E_API_URL="http://127.0.0.1:${BACKEND_PORT}"
          export E2E_BASE_URL="http://localhost:${FRONTEND_PORT}"
          nohup pnpm -C backend dev > backend-dev.log 2>&1 &
          NEXT_PUBLIC_API_URL="$E2E_API_URL" nohup pnpm -C frontend dev > frontend-dev.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS "$E2E_API_URL/health" >/dev/null && curl -fsS "$E2E_BASE_URL/login" >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Application did not become ready in time." >&2
          exit 1

      - name: Run E2E suite
        shell: bash
        run: |
          set -a
          source .env
          set +a
          export E2E_API_URL="http://127.0.0.1:${BACKEND_PORT}"
          export E2E_BASE_URL="http://localhost:${FRONTEND_PORT}"
          # test-env.ts's own defaults (dev-admin/dev-admin-pass, dev-user/dev-user-pass,
          # dev-user@appspine-dev.local, client "template"/"dev-secret-template") match this
          # template's own local dev-infra Keycloak — see the KNOWN GAP comment on this job:
          # nothing here starts that Keycloak, so auth-dependent specs currently fail on
          # connection error, not a clean pass, until a CI Keycloak service is added.
          pnpm --dir e2e test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
            backend-dev.log
            frontend-dev.log
