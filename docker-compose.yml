services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      # No fallback on purpose: a default password would ship as the real password
      # in every fork that never edits it.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set (see .env.example)}
      POSTGRES_DB: app_db
    ports:
      # Loopback-only: an unqualified "PORT:5432" binds 0.0.0.0 and exposes the dev
      # database to everything on the local network.
      - "127.0.0.1:${DB_PORT:-23900}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db_data:
