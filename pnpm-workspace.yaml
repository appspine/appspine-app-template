packages:
  - "backend"
  - "frontend"

overrides:
  '@appspine/common': 0.3.3
  '@appspine/auth': 6.2.2
  '@appspine/audit-log': 1.0.1
  '@appspine/rbac': 4.0.7
  '@appspine/health-check': 0.1.8
  '@appspine/m2m-api-key': 4.0.7
  '@appspine/mcp-server': 0.6.7
  '@appspine/metadata-schema': 0.2.21
  '@appspine/notification': 0.2.2
  '@appspine/frontend-shell': 0.16.3
  '@modelcontextprotocol/node>@hono/node-server': ^1.19.15
  '@nestjs/platform-express>multer': ^2.2.0

# @appspine/* are private packages published by this same org, not public npm -
# the supply-chain risk minimumReleaseAge guards against (freshly-published
# malicious packages) doesn't apply here, and the pnpm 11 default (24h) blocks
# CI right after any release. Scoped to @appspine/* only — the public dependency
# graph (next, react, prisma, ...) keeps the 24h quarantine.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@appspine/*'

allowBuilds:
  '@biomejs/biome': true
  '@prisma/client': true
  '@prisma/engines': true
  bcrypt: true
  esbuild: true
  prisma: true
  sharp: true
