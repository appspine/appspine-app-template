packages:
  - "backend"
  - "frontend"

overrides:
  '@appspine/common': 0.2.0
  # Keep @appspine package resolution on the published framework versions used by
  # this template to avoid duplicate NestJS class instances across peer packages.
  '@appspine/audit-log': 0.5.1

# @appspine/* are private packages published by this same org, not public npm -
# the supply-chain risk minimumReleaseAge guards against (freshly-published
# malicious packages) doesn't apply here, and the pnpm 11 default (24h) blocks
# CI right after any release.
minimumReleaseAge: 0

allowBuilds:
  '@biomejs/biome': true
  '@prisma/client': true
  '@prisma/engines': true
  bcrypt: true
  prisma: true
  sharp: true
