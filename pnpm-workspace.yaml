packages:
  - "backend"
  - "frontend"

overrides:
  '@appspine/common': 0.2.1
  '@appspine/auth': 4.0.2
  '@appspine/audit-log': 0.5.1
  '@appspine/rbac': 3.0.4
  '@appspine/health-check': 0.1.3
  '@appspine/m2m-api-key': 3.0.4
  '@appspine/mcp-server': 0.5.8
  '@appspine/metadata-schema': 0.2.13

# @appspine/* are private packages published by this same org, not public npm -
# the supply-chain risk minimumReleaseAge guards against (freshly-published
# malicious packages) doesn't apply here, and the pnpm 11 default (24h) blocks
# CI right after any release.
minimumReleaseAge: 0

allowBuilds:
  '@biomejs/biome': true
  '@prisma/client': true
  '@prisma/engines': true
  bcrypt: true
  prisma: true
  sharp: true
