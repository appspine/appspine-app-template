packages:
  - "backend"
  - "frontend"

overrides:
  '@appspine/common': 0.3.0
  '@appspine/auth': 5.0.0
  '@appspine/audit-log': 1.0.0
  '@appspine/rbac': 4.0.0
  '@appspine/health-check': 0.1.4
  '@appspine/m2m-api-key': 4.0.0
  '@appspine/mcp-server': 0.6.1
  '@appspine/metadata-schema': 0.2.14

# @appspine/* are private packages published by this same org, not public npm -
# the supply-chain risk minimumReleaseAge guards against (freshly-published
# malicious packages) doesn't apply here, and the pnpm 11 default (24h) blocks
# CI right after any release.
minimumReleaseAge: 0

allowBuilds:
  '@biomejs/biome': true
  '@prisma/client': true
  '@prisma/engines': true
  bcrypt: true
  prisma: true
  sharp: true
